<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="lha-void" cx="50%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#1a1a3a"/>
      <stop offset="40%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="lha-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0.55"/>
      <stop offset="20%" stop-color="#ffb347" stop-opacity="0.36"/>
      <stop offset="55%" stop-color="#ff7c5b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ff7c5b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lha-lantern" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#ffea00"/>
      <stop offset="80%" stop-color="#ffb347" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff7c5b" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="lha-tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a48"/>
      <stop offset="20%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="lha-tower-hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6a6a78" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#6a6a78" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="lha-rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a342a"/>
      <stop offset="50%" stop-color="#1a1818"/>
      <stop offset="100%" stop-color="#0a0a10"/>
    </linearGradient>
    <linearGradient id="lha-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffea00" stop-opacity="0"/>
      <stop offset="15%" stop-color="#ffb347" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#ffea00" stop-opacity="0.55"/>
      <stop offset="85%" stop-color="#ffb347" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffea00" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Deep navy void -->
  <rect x="0" y="0" width="240" height="240" fill="url(#lha-void)"/>

  <!-- Distant halo around the lantern room -->
  <ellipse cx="120" cy="60" rx="105" ry="80" fill="url(#lha-halo)"/>

  <!-- Rotating beam: a group that rotates around the lantern room center -->
  <g transform="translate(120, 60)">
    <!-- Two beam cones, 180 degrees apart, so the beam always sweeps -->
    <g>
      <!-- Beam cone 1: a triangle pointing right from center -->
      <path d="M 0 0 L 180 -14 L 180 14 Z" fill="url(#lha-beam)" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Static horizontal beam band (the SVG version's signature element) -->
  <rect x="0" y="55" width="240" height="8" fill="url(#lha-beam)"/>
  <rect x="0" y="58" width="240" height="2" fill="#ffea00" opacity="0.18"/>

  <!-- Twinkling stars (animated opacity) -->
  <circle cx="22" cy="15" r="0.8" fill="#fff" opacity="0.6">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="12" r="0.6" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="25" r="0.5" fill="#94b0c2" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="180" cy="30" r="0.7" fill="#fff" opacity="0.5">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="10" r="0.4" fill="#94b0c2" opacity="0.3">
    <animate attributeName="opacity" values="0.05;0.4;0.05" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="20" r="0.5" fill="#566c86" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- Rock base -->
  <path d="M 30 222 L 36 214 L 44 218 L 50 210 L 58 215 L 66 206 L 74 213 L 82 204 L 90 211 L 96 202 L 104 210 L 110 205 L 116 211 L 122 204 L 128 210 L 134 202 L 140 211 L 148 204 L 156 213 L 162 206 L 170 215 L 178 210 L 186 218 L 194 214 L 202 220 L 210 222 Z"
        fill="url(#lha-rock)"/>
  <path d="M 38 215 L 52 211 L 68 207 L 84 204 L 100 202 L 120 201 L 140 202 L 156 207 L 172 211 L 186 215 L 202 219"
        stroke="#ffb347" stroke-width="0.8" fill="none" opacity="0.50"/>

  <!-- Tower -->
  <path d="M 109 78 L 131 78 L 140 205 L 100 205 Z" fill="url(#lha-tower)"/>
  <path d="M 109 78 L 131 78 L 140 205 L 100 205 Z" fill="url(#lha-tower-hi)"/>

  <!-- Horizontal bands -->
  <rect x="103" y="115" width="34" height="3" fill="#0a0a14"/>
  <rect x="102" y="150" width="36" height="3" fill="#0a0a14"/>
  <rect x="101" y="182" width="38" height="3" fill="#0a0a14"/>

  <line x1="109" y1="80" x2="100" y2="155" stroke="#ffb347" stroke-width="0.6" opacity="0.25"/>

  <!-- Gallery platform -->
  <rect x="98" y="72" width="44" height="4" fill="#1a1a28"/>
  <rect x="100" y="70" width="40" height="2" fill="#2a2a38"/>
  <circle cx="102" cy="71" r="0.7" fill="#5a5a68"/>
  <circle cx="110" cy="71" r="0.7" fill="#5a5a68"/>
  <circle cx="118" cy="71" r="0.7" fill="#5a5a68"/>
  <circle cx="126" cy="71" r="0.7" fill="#5a5a68"/>
  <circle cx="134" cy="71" r="0.7" fill="#5a5a68"/>
  <circle cx="142" cy="71" r="0.7" fill="#5a5a68"/>

  <!-- Lantern room -->
  <rect x="103" y="48" width="34" height="22" fill="url(#lha-lantern)" rx="2"/>
  <line x1="112" y1="48" x2="112" y2="70" stroke="#5a3a18" stroke-width="0.5" opacity="0.55"/>
  <line x1="120" y1="48" x2="120" y2="70" stroke="#5a3a18" stroke-width="0.5" opacity="0.55"/>
  <line x1="128" y1="48" x2="128" y2="70" stroke="#5a3a18" stroke-width="0.5" opacity="0.55"/>

  <!-- Pulsing lamp core -->
  <ellipse cx="120" cy="60" rx="5" ry="8" fill="#ffffff" opacity="0.85">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="120" cy="60" rx="2.5" ry="4.5" fill="#ffffff">
    <animate attributeName="rx" values="2;3;2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="4;5;4" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Roof -->
  <path d="M 103 48 L 120 32 L 137 48 Z" fill="#1a1a28"/>
  <line x1="120" y1="32" x2="120" y2="26" stroke="#3a3a48" stroke-width="1.2"/>
  <circle cx="120" cy="25" r="1.4" fill="#3a3a48"/>

  <!-- Water ripples (animated horizontal drift) -->
  <g opacity="0.4">
    <rect x="0" y="226" width="240" height="1" fill="#29366f">
      <animate attributeName="x" values="0;-20;0" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="230" width="240" height="1" fill="#29366f">
      <animate attributeName="x" values="0;15;0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="234" width="240" height="1" fill="#29366f">
      <animate attributeName="x" values="0;-12;0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>