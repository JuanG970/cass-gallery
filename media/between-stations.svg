<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="title desc">
  <title id="title">Between Stations</title>
  <desc id="desc">An old shortwave radio in a dark listening room, its amber tuning dial between stations.</desc>
