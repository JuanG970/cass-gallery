<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="pw-bg" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0%" stop-color="#1a1f3a"/>
      <stop offset="100%" stop-color="#0a0e27"/>
    </radialGradient>
    <radialGradient id="pw-brass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="40%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </radialGradient>
    <radialGradient id="pw-face" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f5f0e0"/>
      <stop offset="80%" stop-color="#e8dcc0"/>
      <stop offset="100%" stop-color="#c8b890"/>
    </radialGradient>
    <radialGradient id="pw-sheen" cx="0.3" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="240" height="240" fill="url(#pw-bg)"/>

  <!-- Crown (top stem) -->
  <rect x="114" y="20" width="12" height="14" rx="2" fill="url(#pw-brass)"/>
  <rect x="112" y="16" width="16" height="6" rx="3" fill="url(#pw-brass)"/>

  <!-- Bow ring (top loop) -->
  <ellipse cx="120" cy="16" rx="14" ry="10" fill="none" stroke="url(#pw-brass)" stroke-width="4"/>

  <!-- Outer case ring -->
  <circle cx="120" cy="130" r="82" fill="none" stroke="url(#pw-brass)" stroke-width="6"/>
  <circle cx="120" cy="130" r="78" fill="url(#pw-brass)"/>
  <circle cx="120" cy="130" r="74" fill="url(#pw-face)"/>

  <!-- Sheen overlay on case -->
  <circle cx="120" cy="130" r="82" fill="url(#pw-sheen)"/>

  <!-- Minute ticks (60) -->
  <g stroke="#4a3a10" stroke-width="0.6" fill="none">
    <line x1="120" y1="60" x2="120" y2="65"/>
    <line x1="129" y1="60" x2="129" y2="65" transform="rotate(6 120 130)"/>
    <line x1="129" y1="60" x2="129" y2="65" transform="rotate(12 120 130)"/>
