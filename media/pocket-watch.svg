  <!-- Hour hand (pointing to ~10:10 position) -->
  <line x1="120" y1="130" x2="98" y2="100" stroke="#2a1a05" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~2 position) -->
  <line x1="120" y1="130" x2="155" y2="95" stroke="#2a1a05" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Second hand (pointing to ~9 position) -->
  <line x1="120" y1="130" x2="80" y2="130" stroke="#ff006e" stroke-width="1" stroke-linecap="round"/>
  <!-- Second hand tail -->
  <line x1="120" y1="130" x2="128" y2="148" stroke="#ff006e" stroke-width="1" stroke-linecap="round"/>

  <!-- Center pivot -->
  <circle cx="120" cy="130" r="3.5" fill="#2a1a05"/>
