<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" preserveAspectRatio="xMidYMid meet">
  <!-- ============================================================
       Aurora Borealis — piece #064.
       Three undulating light curtains (green, cyan, magenta) in a
       dark night sky over pine silhouettes and still water.
       Stars twinkle above. The curtains breathe via scaleY, sway
       via skewX, and pulse via opacity on staggered periods.

       All animation is SMIL — no JS, no CSS. Self-contained.

       Timing:
         - Curtain 1 (green):   8s scaleY, 8s opacity, 12s skewX
         - Curtain 2 (cyan):   10s scaleY, 10s opacity, 14s skewX
         - Curtain 3 (magenta):  7s scaleY,  7s opacity, 11s skewX
         - Stars: 3-5s twinkle on independent periods
         - Water reflection: 6s opacity shimmer
       ============================================================ -->

  <defs>
    <linearGradient id="au-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#050714"/>
      <stop offset="40%"  stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="au-green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00ff9f" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00ff9f" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#00cc7a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#006633" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="au-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00f5ff" stop-opacity="0"/>
      <stop offset="35%"  stop-color="#00f5ff" stop-opacity="0.45"/>
      <stop offset="75%"  stop-color="#0099bb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#004455" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="au-magenta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ff006e" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#ff006e" stop-opacity="0.3"/>
      <stop offset="80%"  stop-color="#aa0048" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#330014" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="au-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a0a1a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#050510" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="240" height="180" fill="url(#au-sky)"/>
  <!-- water -->
  <rect x="0" y="180" width="240" height="60" fill="url(#au-water)"/>
  <!-- water surface line -->
  <line x1="0" y1="180" x2="240" y2="180" stroke="#00f5ff" stroke-width="0.3" opacity="0.2"/>

  <!-- background stars (above the aurora) -->
  <g fill="#e8e0ff">
    <circle cx="15"  cy="8"   r="0.5" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="45"  cy="14"  r="0.6" opacity="0.55"><animate attributeName="opacity" values="0.35;0.8;0.35" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="78"  cy="6"   r="0.4" opacity="0.4"><animate attributeName="opacity" values="0.25;0.6;0.25" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="105" cy="18"  r="0.5" opacity="0.45"><animate attributeName="opacity" values="0.3;0.65;0.3" dur="5.1s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="10"  r="0.4" opacity="0.4"/>
    <circle cx="170" cy="22"  r="0.5" opacity="0.5"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4.7s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="5"   r="0.5" opacity="0.45"><animate attributeName="opacity" values="0.25;0.65;0.25" dur="3.9s" repeatCount="indefinite"/></circle>
    <circle cx="225" cy="16"  r="0.4" opacity="0.35"/>
    <circle cx="30"  cy="30"  r="0.4" opacity="0.35"><animate attributeName="opacity" values="0.2;0.55;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="115" cy="35"  r="0.3" opacity="0.3"/>
    <circle cx="185" cy="40"  r="0.4" opacity="0.35"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- aurora curtain 1 (green, left-center) — undulates via scaleY + opacity + skewX -->
  <g transform="translate(50, 0)">
    <path d="M 0,20 Q -15,50 5,80 Q 25,110 10,140 Q -5,160 0,175 L 40,175 Q 45,160 30,140 Q 15,110 35,80 Q 55,50 40,20 Z"
          fill="url(#au-green)" opacity="0.6">
      <animate attributeName="opacity" values="0.35;0.7;0.45;0.35" keyTimes="0;0.3;0.7;1" dur="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 0.85; 1 1.1; 1 0.95; 1 0.85" keyTimes="0;0.35;0.7;1" additive="sum" dur="8s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="skewX" values="-3;2;-3" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- aurora curtain 2 (cyan, center-right) — wider, slower -->
  <g transform="translate(120, 0)">
    <path d="M 0,15 Q -20,45 0,75 Q 20,105 5,135 Q -10,155 5,175 L 55,175 Q 50,155 35,135 Q 20,105 40,75 Q 60,45 40,15 Z"
          fill="url(#au-cyan)" opacity="0.55">
      <animate attributeName="opacity" values="0.3;0.65;0.4;0.3" keyTimes="0;0.35;0.7;1" dur="10s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 0.9; 1 1.12; 1 0.95; 1 0.9" keyTimes="0;0.4;0.7;1" additive="sum" dur="10s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="skewX" values="2;-3;2" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- aurora curtain 3 (magenta, far right) — narrower, faster -->
  <g transform="translate(185, 0)">
    <path d="M 0,25 Q -10,50 5,75 Q 15,100 5,125 Q -5,145 0,170 L 25,170 Q 30,145 20,125 Q 10,100 20,75 Q 35,50 25,25 Z"
          fill="url(#au-magenta)" opacity="0.5">
      <animate attributeName="opacity" values="0.2;0.55;0.35;0.2" keyTimes="0;0.3;0.7;1" dur="7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="1 0.8; 1 1.08; 1 0.9; 1 0.8" keyTimes="0;0.35;0.7;1" additive="sum" dur="7s" repeatCount="indefinite"/>
    </path>
    <animateTransform attributeName="transform" type="skewX" values="-2;3;-2" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" dur="11s" repeatCount="indefinite"/>
  </g>

  <!-- pine tree silhouettes along the horizon -->
  <g fill="#020308">
    <!-- left pine cluster -->
    <path d="M 10,180 L 14,165 L 18,180 Z"/>
    <path d="M 16,180 L 22,158 L 28,180 Z"/>
    <path d="M 24,180 L 30,162 L 36,180 Z"/>
    <!-- center-left pine -->
    <path d="M 45,180 L 52,150 L 59,180 Z"/>
    <path d="M 55,180 L 62,155 L 69,180 Z"/>
    <!-- center pine (tallest) -->
    <path d="M 72,180 L 82,140 L 92,180 Z"/>
    <path d="M 85,180 L 93,148 L 101,180 Z"/>
    <!-- center-right pines -->
    <path d="M 100,180 L 107,155 L 114,180 Z"/>
    <path d="M 110,180 L 118,145 L 126,180 Z"/>
    <path d="M 122,180 L 130,158 L 138,180 Z"/>
    <!-- right pines -->
    <path d="M 140,180 L 147,152 L 154,180 Z"/>
    <path d="M 150,180 L 158,160 L 166,180 Z"/>
    <path d="M 162,180 L 170,148 L 178,180 Z"/>
    <path d="M 175,180 L 182,162 L 189,180 Z"/>
    <!-- far right -->
    <path d="M 195,180 L 202,155 L 209,180 Z"/>
    <path d="M 205,180 L 212,165 L 219,180 Z"/>
    <path d="M 218,180 L 224,158 L 230,180 Z"/>
  </g>

  <!-- water reflections — faint vertical streaks mirroring the aurora colors -->
  <g opacity="0.1">
    <rect x="55"  y="182" width="30" height="40" fill="#00ff9f">
      <animate attributeName="opacity" values="0.05;0.12;0.05" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect x="125" y="182" width="40" height="35" fill="#00f5ff">
      <animate attributeName="opacity" values="0.04;0.1;0.04" dur="6s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="190" y="182" width="20" height="30" fill="#ff006e">
      <animate attributeName="opacity" values="0.03;0.08;0.03" dur="6s" begin="3s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- faint horizon glow where aurora meets the tree line -->
  <ellipse cx="120" cy="180" rx="100" ry="8" fill="#00ff9f" opacity="0.06">
    <animate attributeName="opacity" values="0.04;0.08;0.04" dur="8s" repeatCount="indefinite"/>
  </ellipse>

</svg>