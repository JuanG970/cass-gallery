<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- The brass body: warm gold-to-amber, never going too dark so the whole key reads as one piece of brass -->
    <linearGradient id="key-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f8e098"/>
      <stop offset="40%" stop-color="#e8b868"/>
      <stop offset="80%" stop-color="#a87838"/>
      <stop offset="100%" stop-color="#7a4818"/>
    </linearGradient>
    <!-- The bow upper-left highlight: a soft crescent of pale gold -->
    <radialGradient id="key-bow-hi" cx="32%" cy="28%" r="42%">
      <stop offset="0%"  stop-color="#fef0c8" stop-opacity="0.90"/>
      <stop offset="50%" stop-color="#e8b868" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#e8b868" stop-opacity="0"/>
    </radialGradient>
    <!-- A subtle vertical highlight along the shaft's left edge -->
    <linearGradient id="key-shaft-hi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#fef0c8" stop-opacity="0.65"/>
      <stop offset="60%" stop-color="#fef0c8" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.20"/>
    </linearGradient>
    <!-- A faint warm halo around the key, very subtle -->
    <radialGradient id="key-halo" cx="50%" cy="50%" r="62%">
      <stop offset="0%"  stop-color="#a08868" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#5a3818" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#5a3818" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Dark field background with subtle warm wash centered on the key -->
  <rect x="0" y="0" width="240" height="240" fill="#0a0e27"/>
  <ellipse cx="120" cy="125" rx="115" ry="115" fill="url(#key-halo)"/>

  <!-- The key is drawn tilted ~12 degrees clockwise around its center (120, 125) -->
  <g transform="rotate(12 120 125)">

    <!-- ============================================================
         BRASS BODY: bow + shaft + teeth as separate paths that overlap.
         Drawn upright, rotated by the group transform.
         Layout (in the unrotated frame):
           - Bow center: (118, 66), outer radius ~30, with a small trefoil
             lobe at top. Inner hole radius ~10.
           - Shaft: from y=94 (bow bottom) down to y=204, x=110 to x=126 (16 wide)
           - Teeth: stepped notches on the right side of the shaft
         ============================================================ -->

    <!-- The bow with a small trefoil lobe at the top — a hand-cut old-key detail -->
    <path d="
      M 118,32
      C 122,32 124,36 124,40
      C 136,42 148,54 148,68
      C 148,82 138,92 124,94
      L 112,94
      C 98,92 88,82 88,68
      C 88,54 100,42 112,40
      C 112,36 114,32 118,32
      Z" fill="url(#key-body)"/>

    <!-- The bow's inner hole: a circle, the dark field shows through -->
    <circle cx="118" cy="66" r="11" fill="#0a0e27"/>

    <!-- The shaft + teeth as a single closed path.
         Shaft width: 16 (x=110 to x=126), from y=94 to y=204.
         Teeth: stepped notches on the right side. -->
    <path d="
      M 110,94
      L 126,94
      L 126,170
      L 134,170
      L 134,180
      L 126,180
      L 126,186
      L 132,186
      L 132,194
      L 126,194
      L 126,204
      L 110,204
      Z" fill="url(#key-body)"/>

    <!-- ============================================================
         HIGHLIGHTS
         ============================================================ -->

    <!-- Bow upper-left highlight: a soft pale crescent on the upper-left of the bow -->
    <path d="
      M 95,52
      C 102,42 110,38 120,38
      C 128,38 134,40 140,46
      C 134,44 128,42 120,43
      C 110,44 102,49 96,58
      Z" fill="url(#key-bow-hi)"/>

    <!-- The bright glint on the upper-left of the bow, where light catches -->
    <circle cx="104" cy="48" r="2.2" fill="#fef8e0"/>
    <circle cx="104" cy="48" r="5.0" fill="#fef8e0" fill-opacity="0.22"/>

    <!-- A small glint on the trefoil lobe at the top of the bow -->
    <circle cx="119" cy="36" r="1.0" fill="#fef8e0" fill-opacity="0.85"/>

    <!-- Shaft left-edge highlight: a thin pale strip down the left side of the shaft -->
    <rect x="110" y="96" width="16" height="106" fill="url(#key-shaft-hi)"/>

    <!-- Subtle shadow on the right edge of the shaft for depth -->
    <path d="
      M 124,96
      L 126,96
      L 126,170
      L 124,170
      Z" fill="#3a2008" opacity="0.40"/>

    <!-- Tooth shadow accents: small darker triangles at the inner corners of each notch -->
    <path d="M 126,170 L 130,170 L 126,174 Z" fill="#2a1404" opacity="0.55"/>
    <path d="M 126,186 L 130,186 L 126,190 Z" fill="#2a1404" opacity="0.55"/>

    <!-- A soft shadow under the key, suggesting it's resting on a surface (very faint) -->
    <ellipse cx="120" cy="212" rx="34" ry="3" fill="#000" opacity="0.40"/>

    <!-- A few faint dust motes around the key, barely visible, suggesting still air -->
    <circle cx="46"  cy="76"  r="1.0" fill="#f4ecd8" fill-opacity="0.25"/>
    <circle cx="198" cy="56"  r="0.8" fill="#f4ecd8" fill-opacity="0.20"/>
    <circle cx="200" cy="180" r="1.2" fill="#f4ecd8" fill-opacity="0.30"/>
    <circle cx="38"  cy="170" r="0.7" fill="#f4ecd8" fill-opacity="0.18"/>
    <circle cx="170" cy="38"  r="0.6" fill="#f4ecd8" fill-opacity="0.15"/>
  </g>
</svg>